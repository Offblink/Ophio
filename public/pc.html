<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ophio · PC 控制端</title>
    <script>
    /* UA 分流：手机打开本页 → 回移动版 index.html；?view=pc 强制留在此页 */
    (function () {
        var params = new URLSearchParams(location.search);
        var isMobile = /Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(navigator.userAgent);
        if (isMobile && params.get('view') !== 'pc') {
            location.replace('index.html');
        }
    })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        /* 共享屏幕：铺满视口、保持比例、居中；事件只挂在图片上 */
        #videoFeed {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            image-rendering: auto;
            background: #000;
            display: block;
        }
        /* 控制激活时隐藏本地光标（宿主画面内自带红色十字光标） */
        #videoFeed.live {
            cursor: none;
        }
        /* 状态徽章 */
        #badge {
            position: fixed;
            top: 10px;
            right: 12px;
            z-index: 100;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #fff;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.18);
            pointer-events: none;
            transition: background 0.15s ease;
        }
        #badge.ok      { background: rgba(33, 150, 243, 0.85); }
        #badge.active  { background: rgba(76, 175, 80, 0.9); }
        #badge.paused  { background: rgba(255, 152, 0, 0.9); }
        #badge.error   { background: rgba(244, 67, 54, 0.9); }
        /* 底部操作提示，8 秒后淡出 */
        #hint {
            position: fixed;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%);
            z-index: 100;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            color: #ddd;
            background: rgba(0, 0, 0, 0.6);
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.6s ease;
        }
        #hint.fade {
            opacity: 0;
        }
    </style>
</head>
<body>
    <img id="videoFeed" alt="远程屏幕">
    <div id="badge">正在连接…</div>
    <div id="hint">悬停画面即接管键鼠 · Esc 暂停并释放按键 · 左/右/中键与滚轮直接可用</div>

    <script>
    // ===== 全局状态 =====
    const WS_SERVER_URL = 'ws://' + window.location.hostname + ':8889';
    const MOVE_INTERVAL_MS = 40;      // 鼠标移动节流：25Hz
    const WHEEL_FLUSH_MS = 50;        // 滚轮累积窗口
    const WHEEL_PX_PER_NOTCH = 100;   // deltaY 像素/格（Chrome 系一格约 100）

    let ws = null;
    let reconnectAttempts = 0;
    const MAX_RECONNECT_ATTEMPTS = 10;

    let currentFrameUrl = null;

    // 控制状态机：悬停画面=接管；Esc=暂停+释放；移出画面=解除暂停
    let pointerOverImage = false;
    let paused = false;
    let captureActive = false;

    // 鼠标移动节流（只保留最后一个位置）
    let pendingMove = null;
    let lastMoveSentAt = 0;
    let moveTimer = null;

    // 拖拽状态（记录按下过的按钮，mouseup 时配对释放）
    const heldButtons = new Set();

    // 滚轮累积（只在右上角提示区上滚时清零）
    let wheelAccPx = 0;
    let wheelTimer = null;

    // 按下中的按键（code），释放时/暂停时批量 keyup
    const pressedKeys = new Set();

    const videoFeed = document.getElementById('videoFeed');
    const badge = document.getElementById('badge');
    const hint = document.getElementById('hint');
    setTimeout(() => hint.classList.add('fade'), 8000);

    // ===== 状态徽章 =====
    function setBadge(text, cls) {
        badge.textContent = text;
        badge.className = cls || '';
    }

    function refreshBadge() {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            setBadge('未连接', 'error');
        } else if (captureActive) {
            setBadge('控制中 · Esc 暂停', 'active');
        } else if (paused) {
            setBadge('已暂停 · 移出画面恢复', 'paused');
        } else {
            setBadge('已连接 · 鼠标移入画面接管', 'ok');
        }
    }

    // ===== 坐标映射：图片渲染矩形 → 归一化 0-1 =====
    function normalizePoint(clientX, clientY) {
        const rect = videoFeed.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return null;
        const x = (clientX - rect.left) / rect.width;
        const y = (clientY - rect.top) / rect.height;
        if (x < 0 || x > 1 || y < 0 || y > 1) return null;
        return { x, y };
    }

    // ===== WebSocket =====
    function send(msg) {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify(msg));
            return true;
        }
        return false;
    }

    function connectWebSocket() {
        if (reconnectAttempts >= MAX_RECONNECT_ATTEMPTS) {
            setBadge('连接失败次数过多，请刷新页面', 'error');
            return;
        }
        setBadge('正在连接…', '');
        ws = new WebSocket(WS_SERVER_URL);

        ws.onopen = () => {
            console.log('[Ophio-PC] WebSocket 已连接');
            reconnectAttempts = 0;
            releaseAllKeys();   // 断线期间可能残留的状态一律清掉
            heldButtons.clear();
            wheelAccPx = 0;
            send({
                type: 'browser',
                client: 'pc_desktop_controller',
                userAgent: navigator.userAgent,
                timestamp: Date.now()
            });
            refreshBadge();
            setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'ping', timestamp: Date.now() }));
                }
            }, 30000);
        };

        ws.onmessage = (event) => {
            try {
                const data = event.data;
                if (data instanceof Blob) {
                    updateVideoFrame(data);
                } else if (typeof data === 'string' && data.startsWith('{')) {
                    const response = JSON.parse(data);
                    if (response.status === 'welcome' || response.status === 'ok') return;
                } else if (typeof data === 'string') {
                    updateVideoFrame(data);
                }
            } catch (e) {
                // 忽略解析失败
            }
        };

        ws.onerror = (error) => {
            console.error('[Ophio-PC] WebSocket 错误:', error);
        };

        ws.onclose = () => {
            console.log('[Ophio-PC] WebSocket 已关闭');
            captureActive = false;
            refreshBadge();
            if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                reconnectAttempts++;
                setBadge(`连接断开，正在重试 (${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`, 'error');
                const delay = Math.min(1000 * Math.pow(1.5, reconnectAttempts), 10000);
                setTimeout(connectWebSocket, delay);
            } else {
                setBadge('连接已断开，请刷新页面', 'error');
            }
        };
    }

    function updateVideoFrame(data) {
        try {
            if (data instanceof Blob) {
                if (data.size > 0) {
                    if (currentFrameUrl) URL.revokeObjectURL(currentFrameUrl);
                    currentFrameUrl = URL.createObjectURL(data);
                    videoFeed.src = currentFrameUrl;
                }
            } else if (typeof data === 'string' && data.length > 100) {
                videoFeed.src = data;
            }
        } catch (e) {
            console.error('[Ophio-PC] 更新视频帧失败:', e);
        }
    }

    // ===== 控制激活 / 暂停 =====
    function setCapture(on) {
        if (captureActive === on) return;
        captureActive = on;
        videoFeed.classList.toggle('live', on);
        if (!on) flushMove(true);
        refreshBadge();
    }

    function pauseCapture() {
        paused = true;
        releaseAllKeys();
        setCapture(false);
        refreshBadge();
    }

    function resumeCapture() {
        paused = false;
        if (pointerOverImage) setCapture(true);
        refreshBadge();
    }

    function releaseAllKeys() {
        if (pressedKeys.size === 0) return;
        for (const code of pressedKeys) {
            send({ action: 'keyboard', key: code, state: 'keyup' });
        }
        pressedKeys.clear();
    }

    // ===== 鼠标移动（节流：只发最后一个位置） =====
    function queueMove(p) {
        pendingMove = p;
        const now = performance.now();
        if (now - lastMoveSentAt >= MOVE_INTERVAL_MS) {
            flushMove();
        } else if (!moveTimer) {
            moveTimer = setTimeout(flushMove, MOVE_INTERVAL_MS - (now - lastMoveSentAt));
        }
    }

    function flushMove(force) {
        if (moveTimer) {
            clearTimeout(moveTimer);
            moveTimer = null;
        }
        if (!pendingMove) return;
        if (!force && !captureActive) {
            pendingMove = null;
            return;
        }
        const p = pendingMove;
        pendingMove = null;
        lastMoveSentAt = performance.now();
        send({ action: 'mouse_move', x: p.x, y: p.y, timestamp: Date.now() });
    }

    // ===== 鼠标按键 =====
    function buttonName(button) {
        return button === 1 ? 'middle' : button === 2 ? 'right' : 'left';
    }

    videoFeed.addEventListener('mousedown', (e) => {
        if (!captureActive) return;
        e.preventDefault();
        const p = normalizePoint(e.clientX, e.clientY);
        if (!p) return;
        flushMove(true);                    // 先把积压的移动发出去，再按下
        const button = buttonName(e.button);
        heldButtons.add(e.button);
        send({ action: 'mouse_down', button, x: p.x, y: p.y, timestamp: Date.now() });
    });

    window.addEventListener('mouseup', (e) => {
        if (!heldButtons.has(e.button)) return;
        e.preventDefault();
        heldButtons.delete(e.button);
        const p = normalizePoint(e.clientX, e.clientY);
        const msg = { action: 'mouse_up', button: buttonName(e.button), timestamp: Date.now() };
        if (p) { msg.x = p.x; msg.y = p.y; }
        send(msg);
    });

    // 右键菜单交给宿主：拦截浏览器自带菜单
    videoFeed.addEventListener('contextmenu', (e) => e.preventDefault());
    // 拖拽图片影子、文本选择
    videoFeed.addEventListener('dragstart', (e) => e.preventDefault());

    videoFeed.addEventListener('dblclick', (e) => e.preventDefault());

    // ===== 悬停即接管 =====
    videoFeed.addEventListener('mouseenter', () => {
        pointerOverImage = true;
        if (!paused) setCapture(true);
        refreshBadge();
    });

    videoFeed.addEventListener('mouseleave', () => {
        pointerOverImage = false;
        setCapture(false);
        if (paused) {           // 移出画面 = 解除暂停，移回即恢复控制
            paused = false;
            refreshBadge();
        }
    });

    videoFeed.addEventListener('mousemove', (e) => {
        if (!captureActive) return;
        const p = normalizePoint(e.clientX, e.clientY);
        if (p) queueMove(p);
    });

    // ===== 滚轮（累积换算成格数） =====
    videoFeed.addEventListener('wheel', (e) => {
        if (!captureActive) return;
        e.preventDefault();
        let dy = e.deltaY;
        if (e.deltaMode === 1) dy *= 40;            // 行模式
        else if (e.deltaMode === 2) dy *= window.innerHeight;  // 页模式
        wheelAccPx += -dy;                          // 浏览器 deltaY>0 = 向下滚；协议 amount>0 = 向上
        if (!wheelTimer) wheelTimer = setTimeout(flushWheel, WHEEL_FLUSH_MS);
    }, { passive: false });

    function flushWheel() {
        wheelTimer = null;
        if (wheelAccPx === 0) return;
        const amount = Math.round(wheelAccPx / WHEEL_PX_PER_NOTCH);
        if (amount !== 0) {
            wheelAccPx = 0;
            send({ action: 'scroll', amount, timestamp: Date.now() });
        }
        if (wheelAccPx !== 0 && !wheelTimer) {
            wheelTimer = setTimeout(flushWheel, WHEEL_FLUSH_MS);  // 零头留到下轮
        }
    }

    // ===== 键盘（e.code 物理键直通，宿主 pc_protocol 负责映射） =====
    window.addEventListener('keydown', (e) => {
        // Esc 在暂停态也响应：再按一次直接恢复
        if (e.code === 'Escape') {
            e.preventDefault();
            if (e.repeat) return;              // 长按 Esc 不反复切换暂停
            if (paused) resumeCapture();
            else if (captureActive) pauseCapture();
            return;
        }
        if (!captureActive) return;
        e.preventDefault();
        const code = e.code || e.key;
        if (pressedKeys.has(code)) {
            // 长按：把浏览器自动重复转发给宿主（宿主注入的 keyDown 不会自重复，
            // repeat=true 让宿主静默重按下以产生连发）
            if (e.repeat) {
                send({ action: 'keyboard', key: code, state: 'keydown', repeat: true, timestamp: Date.now() });
            }
            return;
        }
        pressedKeys.add(code);
        send({ action: 'keyboard', key: code, state: 'keydown', timestamp: Date.now() });
    }, true);

    window.addEventListener('keyup', (e) => {
        const code = e.code || e.key;
        if (!pressedKeys.has(code)) return;
        e.preventDefault();
        pressedKeys.delete(code);
        send({ action: 'keyboard', key: code, state: 'keyup', timestamp: Date.now() });
    }, true);

    // 窗口失焦 / 页面隐藏 / 卸载 → 释放一切，防宿主按键卡住
    window.addEventListener('blur', releaseAllKeys);
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            releaseAllKeys();
            heldButtons.clear();
            setCapture(false);
        }
    });
    window.addEventListener('beforeunload', () => {
        releaseAllKeys();
        if (ws) ws.close();
    });

    // ===== 启动 =====
    window.addEventListener('load', () => {
        console.log('[Ophio-PC] 页面加载完成');
        connectWebSocket();
    });
    </script>
</body>
</html>
